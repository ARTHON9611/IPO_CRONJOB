# Cloudflare Worker: IPO Board edge proxy (see edge/src/index.js).
# Deploys to <name>.<your-subdomain>.workers.dev — no custom domain needed.
name = "ipo-edge"
main = "src/index.js"
compatibility_date = "2026-09-01"

# No routes: workers.dev only. When a custom domain exists, add:
# routes = [{ pattern = "ipoboard.example.com/*", zone_name = "example.com" }]
